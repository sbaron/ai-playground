<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Playground</title>
<meta name="description" content="HTML and JavaScript projects vibe-coded with local LLMs.">
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 0 auto; padding: 3rem 1.25rem; }
  h1 { margin-bottom: 0; }
  ul { list-style: none; padding: 0; }
  li { padding: .75rem 0; border-top: 1px solid color-mix(in srgb, currentColor 20%, transparent); }
  li p { margin: .25rem 0 0; opacity: .75; }
</style>
</head>
<body>
<h1>AI Playground</h1>
<p>HTML and JavaScript projects vibe-coded with local LLMs.</p>
<ul id="projects"></ul>
<p id="empty" hidden>Nothing here yet.</p>
<script>
fetch('/projects.json', { cache: 'no-cache' })
  .then(r => r.json())
  .then(projects => {
    const list = document.getElementById('projects');
    document.getElementById('empty').hidden = projects.length > 0;
    for (const p of projects) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = `/${p.slug}/`;
      a.textContent = p.title;
      li.append(a);
      if (p.description) {
        const d = document.createElement('p');
        d.textContent = p.description;
        li.append(d);
      }
      list.append(li);
    }
  });
</script>
</body>
</html>
