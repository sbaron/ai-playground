<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Playground</title>
<meta name="description" content="HTML and JavaScript projects vibe-coded with local LLMs.">
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 0 auto; padding: 3rem 1.25rem; }
  h1 { margin-bottom: 0; }
  ul { list-style: none; padding: 0; }
  li { padding: .75rem 0; border-top: 1px solid color-mix(in srgb, currentColor 20%, transparent); }
  li p { margin: .25rem 0 0; opacity: .75; }
  footer { margin-top: 2rem; }
  footer a { display: inline-flex; align-items: center; gap: .4rem; }
  footer svg { width: 1.25em; height: 1.25em; fill: currentColor; }
</style>
</head>
<body>
<h1>AI Playground</h1>
<p>HTML and JavaScript projects vibe-coded with local LLMs.</p>
<ul id="projects"></ul>
<p id="empty" hidden>Nothing here yet.</p>
<footer>
  <a href="https://github.com/sbaron/ai-playground">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.27-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
    GitHub
  </a>
</footer>
<script>
fetch('/projects.json', { cache: 'no-cache' })
  .then(r => r.json())
  .then(projects => {
    const list = document.getElementById('projects');
    document.getElementById('empty').hidden = projects.length > 0;
    for (const p of projects) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = `/${p.slug}/`;
      a.textContent = p.title;
      li.append(a);
      if (p.description) {
        const d = document.createElement('p');
        d.textContent = p.description;
        li.append(d);
      }
      list.append(li);
    }
  });
</script>
</body>
</html>
