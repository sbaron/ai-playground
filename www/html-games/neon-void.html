<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>NEON VOID // vector space shooter</title>
<style>
  html, body { height: 100%; margin: 0; background: #03030b; overflow: hidden; }
  #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
"use strict";

/* ============================== setup ============================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 960, H = 600, DPR = 1;

const CYAN = '#5df6ff', MAG = '#ff4df0', AMBER = '#ffd95d', GREEN = '#63ff9f', WHITE = '#e9fbff';

// Hard caps keep the neon glow (shadowBlur) cheap on any machine.
const CAP = { bullets: 64, enemies: 46, eShots: 60, particles: 480, waves: 24 };

const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function turnToward(a, b, rate) { const d = angDiff(a, b); return Math.abs(d) <= rate ? b : a + Math.sign(d) * rate; }

let stars = [];
function buildStars() {
  stars = [];
  const n = clamp(Math.round(W * H / 8500), 60, 400);
  for (let i = 0; i < n; i++) stars.push({ x: rnd(0, W), y: rnd(0, H), z: rnd(0.18, 1), p: rnd(0, TAU) });
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(320, window.innerWidth); H = Math.max(320, window.innerHeight);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  buildStars();
}
addEventListener('resize', resize);
resize();

/* ============================== state ============================== */
const G = {
  mode: 'title',          // title | play | dead
  paused: false,
  score: 0, best: loadBest(), lives: 3,
  wave: 1, waveTimer: 0, spawnTimer: 0,
  time: 0, deadTimer: 0, hintTimer: 9,
  shake: 0, banner: null
};

const player = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 13, angle: -Math.PI / 2, thrust: 0, cd: 0, barrel: 1 };

const bullets = [], eShots = [], enemies = [], parts = [], shocks = [];

function loadBest() { try { return parseInt(localStorage.getItem('neonvoid.best') || '0', 10) || 0; } catch (e) { return 0; } }
function saveBest() { try { localStorage.setItem('neonvoid.best', String(G.best)); } catch (e) {} }

/* ============================== input ============================== */
const keys = new Set();
const mouse = { x: W / 2, y: H / 2, down: false, used: false };
const HELD = new Set([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);

addEventListener('keydown', e => {
  if (HELD.has(e.key)) e.preventDefault();
  const k = e.key.toLowerCase();
  keys.add(k);
  if (k === 'p' && G.mode === 'play') G.paused = !G.paused;
  if ((k === ' ' || k === 'enter' || k === 'r')) {
    if (G.mode === 'title') start();
    else if (G.mode === 'dead' && G.deadTimer > 0.7) start();
  }
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => { keys.clear(); mouse.down = false; });

canvas.addEventListener('pointermove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (e.pointerType !== 'touch' || mouse.down) mouse.used = true;
});
canvas.addEventListener('pointerdown', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.down = true; mouse.used = true;
  if (G.mode === 'title') start();
  else if (G.mode === 'dead' && G.deadTimer > 0.7) start();
});
addEventListener('pointerup', () => { mouse.down = false; });
const held = (...ks) => ks.some(k => keys.has(k));

/* ============================== spawners ============================== */
function difficulty() {
  const w = G.wave;
  return {
    interval: Math.max(0.34, 1.45 - (w - 1) * 0.11),   // spawn gap shrinks
    speed: 1 + (w - 1) * 0.075,                        // everything drifts faster
    shipChance: Math.min(0.55, 0.06 + (w - 1) * 0.06), // hunters show up from wave 2
    shipHp: w >= 6 ? 2 : 1,
    fire: Math.max(0.75, 2.0 - (w - 1) * 0.13)
  };
}

// Spawn just outside a random edge, aimed through a jittered point near the player.
function edgeSpawn(pad) {
  const edge = (Math.random() * 4) | 0;
  let x, y;
  if (edge === 0) { x = rnd(0, W); y = -pad; }
  else if (edge === 1) { x = W + pad; y = rnd(0, H); }
  else if (edge === 2) { x = rnd(0, W); y = H + pad; }
  else { x = -pad; y = rnd(0, H); }
  const tx = (G.mode === 'play' ? player.x : W / 2) + rnd(-W * 0.22, W * 0.22);
  const ty = (G.mode === 'play' ? player.y : H / 2) + rnd(-H * 0.22, H * 0.22);
  const a = Math.atan2(ty - y, tx - x);
  return { x, y, a };
}

const ROCK_R = [12, 22, 36];
const ROCK_SCORE = [100, 50, 20];   // index = size tier (0 = smallest)
const ROCK_SPEED = [118, 86, 60];

function spawnRock(size, x, y, ang, speedMul) {
  if (enemies.length >= CAP.enemies) return null;
  const s = speedMul === undefined ? difficulty().speed : speedMul;
  const verts = [];
  const n = 9 + ((Math.random() * 4) | 0);
  for (let i = 0; i < n; i++) verts.push(rnd(0.72, 1.16));
  const e = {
    type: 'rock', size, x, y,
    vx: Math.cos(ang) * ROCK_SPEED[size] * s * rnd(0.7, 1.25),
    vy: Math.sin(ang) * ROCK_SPEED[size] * s * rnd(0.7, 1.25),
    r: ROCK_R[size], hp: 1, verts, angle: rnd(0, TAU), spin: rnd(-1.1, 1.1),
    score: ROCK_SCORE[size], hue: '#9ad7ff'
  };
  enemies.push(e);
  return e;
}

function spawnHunter() {
  if (enemies.length >= CAP.enemies) return null;
  const d = difficulty();
  const p = edgeSpawn(46);
  const e = {
    type: 'ship', size: 1, x: p.x, y: p.y,
    vx: Math.cos(p.a) * 60, vy: Math.sin(p.a) * 60,
    r: 14, hp: d.shipHp, maxHp: d.shipHp,
    angle: p.a, maxSpeed: 165 * d.speed, fire: rnd(0.6, 1.4) * d.fire,
    wob: rnd(-0.7, 0.7), wf: rnd(0.5, 1.3), t: rnd(0, 10),
    score: 150, hue: MAG, hit: 0
  };
  enemies.push(e);
  return e;
}

function spawnOne() {
  const d = difficulty();
  if (Math.random() < d.shipChance) return spawnHunter();
  // Early waves: mostly big rocks to split. Late waves: mix in small fast debris.
  const roll = Math.random();
  const size = G.wave < 3 ? (roll < 0.7 ? 2 : 1) : (roll < 0.42 ? 2 : roll < 0.78 ? 1 : 0);
  const p = edgeSpawn(ROCK_R[size] + 10);
  return spawnRock(size, p.x, p.y, p.a);
}

function updateSpawns(dt) {
  const d = difficulty();
  G.waveTimer += dt;
  if (G.waveTimer >= 18) {
    G.waveTimer = 0; G.wave++;
    G.banner = { text: 'WAVE ' + G.wave, t: 1.8, color: CYAN };
  }
  G.spawnTimer -= dt;
  // Chase-driven gate: no new spawns while the screen is already busy.
  while (G.spawnTimer <= 0) {
    if (enemies.length < CAP.enemies - 3) spawnOne();
    G.spawnTimer += d.interval * rnd(0.8, 1.2);
  }
}

/* ============================== combat ============================== */
function fire() {
  if (player.cd > 0 || bullets.length >= CAP.bullets) return;
  player.cd = 0.155;                                     // rate limit: holding SPACE cannot spam
  const a = player.angle;
  const off = 5 * player.barrel; player.barrel = -player.barrel;
  const px = player.x + Math.cos(a + Math.PI / 2) * off;
  const py = player.y + Math.sin(a + Math.PI / 2) * off;
  bullets.push({ x: px, y: py, vx: Math.cos(a) * 660 + player.vx * 0.35, vy: Math.sin(a) * 660 + player.vy * 0.35, life: 1.05 });
  burst(px, py, CYAN, 2, 60, 0.14);
  if (shocks.length < CAP.waves) shocks.push({ x: px, y: py, r: 4, v: 120, max: 16, color: CYAN, lw: 1 });
}

function enemyFire(e) {
  if (eShots.length >= CAP.eShots) return;
  const a = e.angle + rnd(-0.05, 0.05);
  eShots.push({ x: e.x + Math.cos(a) * 16, y: e.y + Math.sin(a) * 16, vx: Math.cos(a) * 250, vy: Math.sin(a) * 250, life: 3.4 });
}

function burst(x, y, color, n, power, life) {
  for (let i = 0; i < n; i++) {
    if (parts.length >= CAP.particles) parts.shift();
    const a = rnd(0, TAU), s = rnd(0.25, 1) * power;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: (life || 0.55) * rnd(0.6, 1.3), max: life || 0.55, color, w: rnd(1, 2.4) });
  }
}

function killEnemy(e, split) {
  const i = enemies.indexOf(e);
  if (i < 0) return;
  enemies.splice(i, 1);

  if (e.type === 'rock' && split && e.size > 0) {
    for (let k = 0; k < 2; k++) {
      const a = Math.atan2(e.vy, e.vx) + rnd(-0.9, 0.9);
      const child = spawnRock(e.size - 1, e.x + Math.cos(a) * 6, e.y + Math.sin(a) * 6, a, 1);
      if (child) { child.vx = e.vx * 0.6 + Math.cos(a) * 70; child.vy = e.vy * 0.6 + Math.sin(a) * 70; }
    }
  }
  addScore(e.score);
  const big = e.size === 2;
  burst(e.x, e.y, e.type === 'rock' ? e.hue : MAG, big ? 26 : 14, big ? 260 : 190, big ? 0.7 : 0.5);
  if (shocks.length < CAP.waves) shocks.push({ x: e.x, y: e.y, r: e.r * 0.5, v: big ? 420 : 300, max: e.r * (big ? 4 : 3), color: e.type === 'rock' ? WHITE : MAG, lw: 2 });
  G.shake = Math.min(16, G.shake + (big ? 7 : 3.5));
}

function addScore(n) {
  G.score += n;
  if (G.score > G.best) { G.best = G.score; saveBest(); }
}

function hitPlayer(e) {
  if (G.invuln > 0 || G.mode !== 'play') return;
  if (e) killEnemy(e, false);
  G.lives--;
  G.invuln = 2.4;
  G.shake = 22;
  burst(player.x, player.y, CYAN, 34, 320, 0.8);
  if (shocks.length < CAP.waves) shocks.push({ x: player.x, y: player.y, r: 10, v: 700, max: 190, color: WHITE, lw: 2.5 });
  // Knock the neighbourhood clear so respawn is not instantly lethal.
  for (const o of enemies) {
    const dx = o.x - player.x, dy = o.y - player.y, d = Math.hypot(dx, dy) || 1;
    if (d < 200) { o.vx += dx / d * 320; o.vy += dy / d * 320; }
  }
  if (G.lives <= 0) {
    G.mode = 'dead'; G.deadTimer = 0;
    burst(player.x, player.y, MAG, 40, 400, 1.1);
  }
}
G.invuln = 0;

/* ============================== update ============================== */
function updatePlayer(dt) {
  let ax = 0, ay = 0;
  if (held('arrowleft', 'a')) ax -= 1;
  if (held('arrowright', 'd')) ax += 1;
  if (held('arrowup', 'w')) ay -= 1;
  if (held('arrowdown', 's')) ay += 1;
  const m = Math.hypot(ax, ay) || 1;
  const ACC = 1050;
  player.vx += (ax / m) * ACC * dt;
  player.vy += (ay / m) * ACC * dt;
  const drag = Math.exp(-3.4 * dt);
  player.vx *= drag; player.vy *= drag;
  const sp = Math.hypot(player.vx, player.vy), MAX = 440;
  if (sp > MAX) { player.vx = player.vx / sp * MAX; player.vy = player.vy / sp * MAX; }
  player.x += player.vx * dt; player.y += player.vy * dt;
  const pad = player.r + 2;
  if (player.x < pad) { player.x = pad; player.vx = 0; }
  if (player.x > W - pad) { player.x = W - pad; player.vx = 0; }
  if (player.y < pad) { player.y = pad; player.vy = 0; }
  if (player.y > H - pad) { player.y = H - pad; player.vy = 0; }

  let target = player.angle;
  if (mouse.used) target = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  else if (ax || ay) target = Math.atan2(ay, ax);
  player.angle = turnToward(player.angle, target, (mouse.used ? 22 : 9) * dt);

  player.thrust = Math.min(1, Math.hypot(player.vx, player.vy) / MAX);
  player.cd -= dt;
  if (G.invuln > 0) G.invuln -= dt;
  if (held(' ') || mouse.down) fire();
  if (player.thrust > 0.35 && Math.random() < 0.55) {
    burst(player.x - Math.cos(player.angle) * 13, player.y - Math.sin(player.angle) * 13, AMBER, 1, 90, 0.22);
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) { bullets.splice(i, 1); continue; }
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      const dx = e.x - b.x, dy = e.y - b.y;
      if (dx * dx + dy * dy <= (e.r + 3) * (e.r + 3)) {
        bullets.splice(i, 1);
        e.hp--;
        if (e.hit !== undefined) e.hit = 0.12;
        if (e.hp <= 0) killEnemy(e, true);
        else { burst(b.x, b.y, WHITE, 5, 130, 0.22); G.shake = Math.min(10, G.shake + 1.2); }
        break;
      }
    }
  }
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.type === 'ship') {
      e.t += dt;
      if (e.hit > 0) e.hit -= dt;
      const want = Math.atan2(player.y - e.y, player.x - e.x) + Math.sin(e.t * e.wf) * 0.55 + e.wob * 0.35;
      e.angle = turnToward(e.angle, want, 2.2 * dt);
      const acc = 260;
      e.vx += Math.cos(e.angle) * acc * dt; e.vy += Math.sin(e.angle) * acc * dt;
      const sp = Math.hypot(e.vx, e.vy);
      if (sp > e.maxSpeed) { e.vx = e.vx / sp * e.maxSpeed; e.vy = e.vy / sp * e.maxSpeed; }
      const d = Math.hypot(player.x - e.x, player.y - e.y);
      e.fire -= dt;
      if (e.fire <= 0 && d < 620 && Math.abs(angDiff(e.angle, Math.atan2(player.y - e.y, player.x - e.x))) < 0.35) {
        enemyFire(e);
        e.fire = difficulty().fire * rnd(0.8, 1.5);
      }
    } else {
      e.angle += e.spin * dt;
    }
    e.x += e.vx * dt; e.y += e.vy * dt;

    // Wrap with a margin so objects slide off and re-enter smoothly.
    const m = e.r + 30;
    if (e.x < -m) e.x = W + m; else if (e.x > W + m) e.x = -m;
    if (e.y < -m) e.y = H + m; else if (e.y > H + m) e.y = -m;

    const dx = player.x - e.x, dy = player.y - e.y, rr = e.r + player.r * 0.8;
    if (dx * dx + dy * dy <= rr * rr) hitPlayer(e);
  }
}

function updateEShots(dt) {
  for (let i = eShots.length - 1; i >= 0; i--) {
    const s = eShots[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0 || s.x < -20 || s.x > W + 20 || s.y < -20 || s.y > H + 20) { eShots.splice(i, 1); continue; }
    const dx = player.x - s.x, dy = player.y - s.y, rr = player.r * 0.78;
    if (dx * dx + dy * dy <= rr * rr) { eShots.splice(i, 1); hitPlayer(null); }
  }
}

function updateFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.exp(-2.2 * dt); p.vy *= Math.exp(-2.2 * dt);
    p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = shocks.length - 1; i >= 0; i--) {
    const s = shocks[i];
    s.r += s.v * dt; s.v *= Math.exp(-3 * dt);
    if (s.r >= s.max) shocks.splice(i, 1);
  }
  if (G.shake > 0) G.shake = Math.max(0, G.shake - 34 * dt);
  if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }
  for (const st of stars) {
    st.y += (8 + st.z * 26) * dt;
    st.p += dt * (0.8 + st.z);
    if (st.y > H) { st.y = -2; st.x = rnd(0, W); }
  }
}

function update(dt) {
  G.time += dt;
  updateFx(dt);
  if (G.mode === 'title') {
    // Ambient rocks drift behind the title card; the player is not live yet.
    if (enemies.length < 7 && Math.random() < dt * 1.4) {
      const p = edgeSpawn(40);
      const e = spawnRock(2, p.x, p.y, p.a, 0.45);
      if (e) e.hue = '#5f7fa8';
    }
    return;
  }
  if (G.mode === 'dead') { G.deadTimer += dt; return; }
  if (G.paused) return;

  G.hintTimer -= dt;
  updatePlayer(dt);
  updateSpawns(dt);
  updateBullets(dt);
  updateEnemies(dt);
  updateEShots(dt);
}

/* ============================== render ============================== */
function stroke(color, blur, lw, path) {
  ctx.shadowColor = color; ctx.shadowBlur = blur;
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); path(); ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawBackground() {
  ctx.fillStyle = '#03030b';
  ctx.fillRect(0, 0, W, H);
  // faint grid for depth
  ctx.strokeStyle = 'rgba(70,110,190,0.07)';
  ctx.lineWidth = 1;
  const gs = 64, oy = (G.time * 12) % gs;
  ctx.beginPath();
  for (let x = 0; x <= W; x += gs) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = -gs + oy; y <= H; y += gs) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  for (const st of stars) {
    const a = 0.25 + st.z * 0.55 * (0.6 + 0.4 * Math.sin(st.p));
    ctx.fillStyle = 'rgba(190,225,255,' + a.toFixed(3) + ')';
    ctx.fillRect(st.x, st.y, st.z * 1.8, st.z * 1.8);
  }
}

function drawRock(e) {
  ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.angle);
  stroke(e.hit > 0 ? WHITE : e.hue, 12, e.size === 0 ? 1.4 : 1.9, () => {
    const n = e.verts.length;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU, r = e.r * e.verts[i];
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
  });
  if (e.size > 0) {
    stroke('rgba(154,215,255,0.4)', 4, 1, () => {
      ctx.moveTo(-e.r * 0.35, -e.r * 0.1); ctx.lineTo(e.r * 0.1, e.r * 0.3);
    });
  }
  ctx.restore();
}

function drawHunter(e) {
  ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.angle);
  const c = e.hit > 0 ? WHITE : MAG;
  stroke(c, 14, 2, () => {
    ctx.moveTo(16, 0); ctx.lineTo(-9, -11); ctx.lineTo(-4, 0); ctx.lineTo(-9, 11); ctx.closePath();
  });
  stroke('rgba(255,140,250,0.75)', 8, 1, () => {
    ctx.moveTo(-4, -5); ctx.lineTo(7, 0); ctx.lineTo(-4, 5);
  });
  ctx.restore();
  if (e.maxHp > 1) {
    stroke('rgba(255,77,240,0.55)', 4, 2, () => {
      ctx.arc(e.x, e.y, e.r + 7, -Math.PI / 2, -Math.PI / 2 + TAU * (e.hp / e.maxHp));
    });
  }
}

function drawPlayer() {
  if (G.invuln > 0 && Math.floor(G.time * 14) % 2 === 0) return;
  ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
  if (player.thrust > 0.1) {
    const f = 8 + player.thrust * 13 * rnd(0.7, 1.2);
    stroke(AMBER, 14, 1.6, () => {
      ctx.moveTo(-10, -4); ctx.lineTo(-10 - f, 0); ctx.lineTo(-10, 4);
    });
  }
  stroke(CYAN, 16, 2.2, () => {
    ctx.moveTo(17, 0); ctx.lineTo(-11, -10); ctx.lineTo(-5, 0); ctx.lineTo(-11, 10); ctx.closePath();
  });
  stroke(GREEN, 8, 1.4, () => {
    ctx.moveTo(6, 0); ctx.lineTo(-3, -4); ctx.lineTo(-3, 4); ctx.closePath();
  });
  ctx.restore();
  if (G.invuln > 0) {
    stroke('rgba(93,246,255,0.35)', 10, 1.5, () => ctx.arc(player.x, player.y, player.r + 9 + Math.sin(G.time * 8) * 2));
  }
}

function drawFx() {
  for (const s of shocks) {
    const a = clamp(1 - s.r / s.max, 0, 1);
    ctx.globalAlpha = a;
    stroke(s.color, 10, s.lw || 2, () => ctx.arc(s.x, s.y, s.r, 0, TAU));
    ctx.globalAlpha = 1;
  }
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.strokeStyle = p.color; ctx.lineWidth = p.w;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.016, p.y - p.vy * 0.016);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawShots() {
  for (const b of bullets) {
    const a = Math.atan2(b.vy, b.vx);
    stroke(CYAN, 12, 2.4, () => {
      ctx.moveTo(b.x - Math.cos(a) * 7, b.y - Math.sin(a) * 7);
      ctx.lineTo(b.x + Math.cos(a) * 7, b.y + Math.sin(a) * 7);
    });
  }
  for (const s of eShots) {
    stroke(MAG, 14, 2.2, () => ctx.arc(s.x, s.y, 3.2, 0, TAU));
  }
}

function text(str, x, y, size, color, align, blur, spacing) {
  ctx.font = '700 ' + size + "px 'Courier New', ui-monospace, monospace";
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  if (spacing) {
    // manual letter-spacing for the retro CRT feel
    const widths = [];
    let total = 0;
    for (const ch of str) { const w = ctx.measureText(ch).width; widths.push(w); total += w + spacing; }
    total -= spacing;
    let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
    ctx.shadowColor = color; ctx.shadowBlur = blur === undefined ? 12 : blur;
    ctx.fillStyle = color;
    widths.forEach((w, i) => { ctx.fillText(str[i], cx, y); cx += w + spacing; });
    ctx.shadowBlur = 0;
    return;
  }
  ctx.shadowColor = color; ctx.shadowBlur = blur === undefined ? 12 : blur;
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.shadowBlur = 0;
}

function pad(n, len) { return String(Math.max(0, Math.floor(n))).padStart(len, '0'); }

function drawHUD() {
  text('SCORE ' + pad(G.score, 6), 22, 30, 20, CYAN, 'left', 14, 2);
  text('WAVE ' + pad(G.wave, 2), W / 2, 30, 18, AMBER, 'center', 14, 3);
  text('BEST ' + pad(G.best, 6), W - 22, 30, 16, GREEN, 'right', 10, 2);

  text('LIVES', 22, H - 42, 12, 'rgba(93,246,255,0.6)', 'left', 6, 2);
  for (let i = 0; i < G.lives; i++) {
    const x = 26 + i * 26, y = H - 20;
    stroke(CYAN, 10, 1.8, () => {
      ctx.moveTo(x + 9, y); ctx.lineTo(x - 6, y - 6); ctx.lineTo(x - 2, y); ctx.lineTo(x - 6, y + 6); ctx.closePath();
    });
  }
  if (G.mode === 'play' && G.hintTimer > 0) {
    ctx.globalAlpha = clamp(G.hintTimer / 2, 0, 1);
    text('ARROWS/WASD MOVE  ·  MOUSE AIM  ·  SPACE/CLICK FIRE  ·  P PAUSE', W - 22, H - 24, 12, 'rgba(233,251,255,0.55)', 'right', 6, 1);
    ctx.globalAlpha = 1;
  }
  if (G.banner) {
    const a = clamp(G.banner.t / 1.8, 0, 1);
    ctx.globalAlpha = a * (0.7 + 0.3 * Math.sin(G.time * 12));
    text(G.banner.text, W / 2, H * 0.26, 40 + (1 - a) * 8, MAG, 'center', 22, 8);
    ctx.globalAlpha = 1;
  }
  if (G.paused) {
    veil(0.45);
    text('PAUSED', W / 2, H / 2, 44, CYAN, 'center', 22, 10);
    text('PRESS P TO RESUME', W / 2, H / 2 + 42, 15, WHITE, 'center', 10, 3);
  }
}

function veil(a) { ctx.fillStyle = 'rgba(3,3,11,' + a + ')'; ctx.fillRect(0, 0, W, H); }

function drawTitle() {
  veil(0.35);
  const cy = H / 2;
  text('NEON VOID', W / 2, cy - 90, clamp(W * 0.1, 40, 86), CYAN, 'center', 26, 10);
  text('VECTOR SPACE SHOOTER', W / 2, cy - 40, clamp(W * 0.028, 13, 20), MAG, 'center', 14, 6);
  text('ARROWS / WASD  MOVE      MOUSE  AIM      SPACE / CLICK  FIRE', W / 2, cy + 16, clamp(W * 0.02, 12, 16), WHITE, 'center', 8, 2);
  text('ASTEROIDS SPLIT WHEN SHOT  ·  3 LIVES  ·  WAVES GET HUNGRIER', W / 2, cy + 46, clamp(W * 0.02, 12, 16), 'rgba(190,225,255,0.7)', 'center', 8, 2);
  if (Math.floor(G.time * 2) % 2 === 0) text('PRESS SPACE OR CLICK TO LAUNCH', W / 2, cy + 108, 18, GREEN, 'center', 16, 4);
  if (G.best) text('BEST ' + pad(G.best, 6), W / 2, cy + 148, 14, AMBER, 'center', 10, 3);
}

function drawDead() {
  veil(Math.min(0.72, G.deadTimer * 1.4));
  const cy = H / 2;
  text('GAME OVER', W / 2, cy - 74, clamp(W * 0.09, 38, 78), MAG, 'center', 26, 10);
  text('FINAL SCORE  ' + pad(G.score, 6), W / 2, cy - 4, 26, CYAN, 'center', 18, 4);
  text('WAVES SURVIVED  ' + G.wave, W / 2, cy + 30, 16, AMBER, 'center', 10, 3);
  text(G.score >= G.best ? 'NEW PERSONAL BEST' : 'BEST  ' + pad(G.best, 6), W / 2, cy + 60, 15, GREEN, 'center', 10, 3);
  if (G.deadTimer > 0.7 && Math.floor(G.time * 2) % 2 === 0)
    text('PRESS R / SPACE OR CLICK TO RESTART', W / 2, cy + 116, 17, WHITE, 'center', 14, 3);
}

function render() {
  drawBackground();
  ctx.save();
  if (G.shake > 0.2) ctx.translate(rnd(-G.shake, G.shake) * 0.5, rnd(-G.shake, G.shake) * 0.5);
  drawFx();
  for (const e of enemies) e.type === 'rock' ? drawRock(e) : drawHunter(e);
  drawShots();
  if (G.mode === 'play') drawPlayer();
  ctx.restore();

  // CRT scanlines
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);

  if (G.mode === 'title') drawTitle();
  else if (G.mode === 'dead') drawDead();
  else drawHUD();
}

/* ============================== flow ============================== */
function start() {
  G.mode = 'play'; G.paused = false;
  G.score = 0; G.lives = 3; G.wave = 1; G.waveTimer = 0; G.spawnTimer = 0.9;
  G.time = 0; G.hintTimer = 9; G.invuln = 2; G.shake = 0; G.banner = { text: 'WAVE 1', t: 1.6, color: CYAN };
  bullets.length = 0; eShots.length = 0; enemies.length = 0; parts.length = 0; shocks.length = 0;
  player.x = W / 2; player.y = H / 2; player.vx = player.vy = 0; player.angle = -Math.PI / 2; player.cd = 0;
}

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 1 / 20) dt = 1 / 20;    // clamp so tab-switches cannot teleport anything
  update(dt);
  render();
}
requestAnimationFrame(frame);

})();
</script>
</body>
